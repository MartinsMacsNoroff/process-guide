<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program development — dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; min-height: 100vh; padding: 24px 16px 60px; color: #1a1a1a; }
  .container { max-width: 900px; margin: 0 auto; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-bar h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .top-bar-right { display: flex; align-items: center; gap: 10px; }
  .refresh-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .refresh-btn:hover { border-color: #D85A30; color: #D85A30; }
  .last-updated { font-size: 11px; color: #666; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
  .stat { background: #242424; border: 1px solid #333; border-radius: 10px; padding: 16px; }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 28px; font-weight: 600; color: #fff; }
  .stat-sub { font-size: 11px; color: #666; margin-top: 3px; }

  .section-label { font-size: 10px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }

  .project-card { background: #fff; border-radius: 12px; margin-bottom: 10px; overflow: hidden; border: 1px solid #e8e8e8; }
  .project-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; transition: background .15s; }
  .project-header:hover { background: #fafafa; }
  .ph-icon { font-size: 16px; flex-shrink: 0; }
  .ph-name { font-size: 14px; font-weight: 600; color: #1a1a1a; flex: 1; }
  .ph-badge { font-size: 10px; padding: 2px 9px; border-radius: 20px; white-space: nowrap; font-weight: 500; }
  .ph-owner { font-size: 12px; color: #888; white-space: nowrap; }
  .ph-deadline { font-size: 11px; color: #aaa; white-space: nowrap; }
  .ph-pct { font-size: 12px; font-weight: 500; color: #D85A30; min-width: 36px; text-align: right; }
  .ph-chevron { font-size: 14px; color: #bbb; transition: transform .2s; }
  .ph-chevron.open { transform: rotate(180deg); }

  .progress-wrap { padding: 0 18px 14px; }
  .phase-row { display: flex; gap: 3px; margin-bottom: 5px; }
  .phase-lbl { font-size: 9px; color: #aaa; text-align: center; }
  .progress-track { height: 6px; border-radius: 3px; display: flex; gap: 2px; background: #f0f0f0; overflow: hidden; }
  .progress-seg { height: 100%; border-radius: 2px; }
  .dots-row { display: flex; margin-top: 8px; }
  .dot-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-lbl { font-size: 9px; color: #aaa; }

  .detail-panel { display: none; border-top: 1px solid #f0f0f0; background: #fafafa; padding: 16px 18px; }
  .detail-panel.open { display: block; }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .di-label { font-size: 11px; color: #888; margin-bottom: 3px; }
  .di-value { font-size: 13px; color: #1a1a1a; font-weight: 500; }
  .ms-section-label { font-size: 10px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .ms-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .ms-row:last-child { border-bottom: none; }
  .ms-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ms-name { font-size: 12px; color: #1a1a1a; flex: 1; }
  .ms-owner { font-size: 11px; color: #888; }
  .ms-date { font-size: 11px; color: #aaa; min-width: 70px; text-align: right; }

  .edit-btn { font-size: 11px; padding: 4px 10px; border: 1px solid #e0e0e0; border-radius: 5px; background: transparent; color: #888; cursor: pointer; margin-top: 12px; }
  .edit-btn:hover { border-color: #D85A30; color: #D85A30; }

  .empty-state { background: #242424; border: 1px dashed #333; border-radius: 12px; padding: 40px; text-align: center; margin-bottom: 10px; }
  .empty-state p { color: #666; font-size: 13px; line-height: 1.6; }
  .empty-state strong { color: #aaa; }

  .edit-modal-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; min-height: 400px; background: rgba(0,0,0,0.5); align-items: flex-start; justify-content: center; padding-top: 40px; z-index: 100; }
  .edit-modal-overlay.open { display: flex; }
  .edit-modal { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; }
  .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .modal-field { margin-bottom: 12px; }
  .modal-label { font-size: 12px; color: #555; margin-bottom: 4px; }
  .modal-input { width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; outline: none; }
  .modal-input:focus { border-color: #D85A30; }
  .modal-select { width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; outline: none; background: #fff; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #e0e0e0; background: transparent; }
  .modal-btn.primary { background: #D85A30; color: #fff; border-color: #D85A30; }
  .modal-btn.danger { background: #fff; color: #cc3333; border-color: #fca5a5; }

  .loading { text-align: center; padding: 40px; color: #666; font-size: 13px; }
</style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <h1>Program development dashboard</h1>
    <div class="top-bar-right">
      <span class="last-updated" id="last-updated"></span>
      <button class="refresh-btn" onclick="loadDashboard()">
        <i class="ti ti-refresh" aria-hidden="true"></i> Refresh
      </button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-label">Active projects</div><div class="stat-value" id="s-active">—</div><div class="stat-sub" id="s-active-sub"></div></div>
    <div class="stat"><div class="stat-label">Completed</div><div class="stat-value" id="s-done">—</div><div class="stat-sub">NOKUT submitted</div></div>
    <div class="stat"><div class="stat-label">At risk</div><div class="stat-value" id="s-risk">—</div><div class="stat-sub">Needs attention</div></div>
    <div class="stat"><div class="stat-label">Total programs</div><div class="stat-value" id="s-total">—</div><div class="stat-sub">In portfolio</div></div>
  </div>

  <div class="section-label" id="active-label">Active projects</div>
  <div id="active-projects"><div class="loading">Loading...</div></div>

  <div class="section-label" style="margin-top:20px" id="done-label">Completed</div>
  <div id="done-projects"></div>

</div>

<!-- Edit modal -->
<div class="edit-modal-overlay" id="edit-overlay">
  <div class="edit-modal">
    <div class="modal-title">Edit project details</div>
    <input type="hidden" id="edit-id">
    <div class="modal-field">
      <div class="modal-label">Program name</div>
      <input class="modal-input" id="edit-name" type="text">
    </div>
    <div class="modal-field">
      <div class="modal-label">Project manager</div>
      <input class="modal-input" id="edit-owner" type="text">
    </div>
    <div class="modal-field">
      <div class="modal-label">Target deadline</div>
      <input class="modal-input" id="edit-deadline" type="text" placeholder="e.g. Nov 2026">
    </div>
    <div class="modal-field">
      <div class="modal-label">Current step (1–8)</div>
      <input class="modal-input" id="edit-step" type="number" min="1" max="8">
    </div>
    <div class="modal-field">
      <div class="modal-label">Status</div>
      <select class="modal-select" id="edit-status">
        <option value="on-track">On track</option>
        <option value="at-risk">At risk</option>
        <option value="done">Completed</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn danger" onclick="deleteProject()">Delete project</button>
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="saveEdit()">Save changes</button>
    </div>
  </div>
</div>

<script>
const CORAL = '#D85A30';
const steps = ['Strategy','Mandate','Plan','Workshops','Outcomes','Course Dev','QA','LOKUT'];
const phases = [
  {label:'Phase 1', steps:3, color:'#D85A30'},
  {label:'Phase 2', steps:4, color:'#c04d24'},
  {label:'Phase 3', steps:1, color:'#712B13'},
];

let allProjects = [];
let editingId = null;

async function loadDashboard() {
  try {
    const result = await window.storage.get('dashboard_projects', true).catch(() => null);
    allProjects = result ? JSON.parse(result.value) : [];
  } catch(e) {
    allProjects = [];
  }

  if (allProjects.length === 0) {
    renderEmpty();
    updateStats([]);
    return;
  }

  updateStats(allProjects);
  renderProjects(allProjects.filter(p => p.status !== 'done'), 'active-projects');
  renderProjects(allProjects.filter(p => p.status === 'done'), 'done-projects');

  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}

function updateStats(projects) {
  const active = projects.filter(p => p.status !== 'done').length;
  const done = projects.filter(p => p.status === 'done').length;
  const risk = projects.filter(p => p.status === 'at-risk').length;
  document.getElementById('s-active').textContent = active;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-risk').textContent = risk;
  document.getElementById('s-total').textContent = projects.length;
  document.getElementById('s-active-sub').textContent = risk > 0 ? risk + ' at risk' : 'All on track';
}

function renderEmpty() {
  document.getElementById('active-projects').innerHTML = `
    <div class="empty-state">
      <p><strong>No projects yet</strong><br>Go to the Process guide tab → Step 3 → generate a project plan → click "Save to dashboard".<br>Projects will appear here automatically.</p>
    </div>`;
  document.getElementById('done-projects').innerHTML = '';
}

function pct(step) { return Math.round((step / 8) * 100); }

function renderProjects(projects, containerId) {
  const container = document.getElementById(containerId);
  if (!projects.length) { container.innerHTML = '<p style="color:#666;font-size:12px;padding:8px 0">None yet.</p>'; return; }
  container.innerHTML = '';
  projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';

    const statusIcon = p.status === 'done' ? 'ti-circle-check' : p.status === 'at-risk' ? 'ti-alert-triangle' : 'ti-circle';
    const statusColor = p.status === 'done' ? '#888' : p.status === 'at-risk' ? '#BA7517' : CORAL;
    const badgeBg = p.status === 'done' ? '#f5f5f5' : p.status === 'at-risk' ? '#FAEEDA' : '#FAECE7';
    const badgeColor = p.status === 'done' ? '#666' : p.status === 'at-risk' ? '#633806' : '#712B13';
    const badgeText = p.status === 'done' ? 'Completed' : p.status === 'at-risk' ? 'At risk' : 'On track';

    let progressSegs = '';
    phases.forEach((ph, pi) => {
      const phaseStart = phases.slice(0,pi).reduce((s,pp)=>s+pp.steps,0);
      const done = Math.max(0, Math.min((p.currentStep||1) - phaseStart, ph.steps));
      const pct2 = done / ph.steps;
      const fill = p.status === 'done' ? '#888' : (pct2 > 0 ? ph.color : '#f0f0f0');
      progressSegs += `<div class="progress-seg" style="flex:${ph.steps};background:${pct2>0?fill:'#f0f0f0'}"></div>`;
    });

    let dotsHTML = '';
    steps.forEach((s, i) => {
      const isDone = i < (p.currentStep||1);
      const isActive = i === (p.currentStep||1) - 1;
      const col = p.status === 'done' ? '#888' : (isDone || isActive ? CORAL : '#e0e0e0');
      dotsHTML += `<div class="dot-wrap"><div class="dot" style="background:${col};opacity:${!isDone&&!isActive?0.4:1}"></div><div class="dot-lbl">${s.split(' ')[0]}</div></div>`;
    });

    let milestonesHTML = (p.milestones||[]).map(m => {
      const bg = m.done ? '#D85A30' : m.active ? '#FAECE7' : '#f5f5f5';
      const iconColor = m.done ? '#fff' : m.active ? '#D85A30' : '#ccc';
      const icon = m.done ? 'ti-check' : 'ti-circle';
      return `<div class="ms-row">
        <div class="ms-icon" style="background:${bg}"><i class="ti ${icon}" style="font-size:10px;color:${iconColor}"></i></div>
        <span class="ms-name" style="${m.active?'font-weight:600':''}${m.done?'color:#888':''}">${m.name}</span>
        <span class="ms-owner">${m.owner||'—'}</span>
        <span class="ms-date">${m.date||'—'}</span>
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="project-header" onclick="toggleDetail('${p.id}')">
        <i class="ti ${statusIcon} ph-icon" style="color:${statusColor}"></i>
        <span class="ph-name">${p.name}</span>
        <span class="ph-badge" style="background:${badgeBg};color:${badgeColor}">${badgeText}</span>
        <span class="ph-owner"><i class="ti ti-user" style="font-size:12px"></i> ${p.owner||'—'}</span>
        <span class="ph-deadline"><i class="ti ti-calendar" style="font-size:12px"></i> ${p.deadline||'—'}</span>
        <span class="ph-pct">${pct(p.currentStep||1)}%</span>
        <i class="ti ti-chevron-down ph-chevron" id="chev-${p.id}"></i>
      </div>
      <div class="progress-wrap">
        <div class="phase-row">
          ${phases.map(ph=>`<div class="phase-lbl" style="flex:${ph.steps};text-align:center">${ph.label}</div>`).join('')}
        </div>
        <div class="progress-track">${progressSegs}</div>
        <div class="dots-row">${dotsHTML}</div>
        <div style="display:flex;justify-content:space-between;margin-top:5px">
          <span style="font-size:11px;color:#aaa">Step ${p.currentStep||1} of 8</span>
          <span style="font-size:11px;color:#aaa">Created ${p.created||'—'}</span>
        </div>
      </div>
      <div class="detail-panel" id="detail-${p.id}">
        <div class="detail-grid">
          <div><div class="di-label">Project manager</div><div class="di-value">${p.owner||'—'}</div></div>
          <div><div class="di-label">Target deadline</div><div class="di-value">${p.deadline||'—'}</div></div>
          <div><div class="di-label">Created</div><div class="di-value">${p.created||'—'}</div></div>
        </div>
        ${p.summary ? `<div style="font-size:12px;color:#555;margin-bottom:12px;padding:10px;background:#fff;border-radius:6px;border:1px solid #e0e0e0;line-height:1.6">${p.summary}...</div>` : ''}
        <div class="ms-section-label">Milestones</div>
        ${milestonesHTML}
        <button class="edit-btn" onclick="openEdit('${p.id}')"><i class="ti ti-edit" style="font-size:12px"></i> Edit details</button>
      </div>`;

    container.appendChild(card);
  });
}

function toggleDetail(id) {
  const panel = document.getElementById('detail-' + id);
  const chev = document.getElementById('chev-' + id);
  const open = panel.classList.contains('open');
  panel.classList.toggle('open', !open);
  chev.classList.toggle('open', !open);
}

function openEdit(id) {
  editingId = id;
  const p = allProjects.find(p => p.id === id);
  if (!p) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-name').value = p.name;
  document.getElementById('edit-owner').value = p.owner || '';
  document.getElementById('edit-deadline').value = p.deadline || '';
  document.getElementById('edit-step').value = p.currentStep || 1;
  document.getElementById('edit-status').value = p.status || 'on-track';
  document.getElementById('edit-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('edit-overlay').classList.remove('open');
  editingId = null;
}

async function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const idx = allProjects.findIndex(p => p.id === id);
  if (idx < 0) return;

  const step = parseInt(document.getElementById('edit-step').value) || 1;
  allProjects[idx] = {
    ...allProjects[idx],
    name: document.getElementById('edit-name').value,
    owner: document.getElementById('edit-owner').value,
    deadline: document.getElementById('edit-deadline').value,
    currentStep: Math.max(1, Math.min(8, step)),
    status: document.getElementById('edit-status').value,
    milestones: allProjects[idx].milestones.map((m, i) => ({
      ...m, done: i < step - 1, active: i === step - 1
    }))
  };

  await window.storage.set('dashboard_projects', JSON.stringify(allProjects), true);
  closeModal();
  loadDashboard();
}

async function deleteProject() {
  if (!confirm('Delete this project from the dashboard?')) return;
  allProjects = allProjects.filter(p => p.id !== editingId);
  await window.storage.set('dashboard_projects', JSON.stringify(allProjects), true);
  closeModal();
  loadDashboard();
}

loadDashboard();
</script>
</body>
</html>
